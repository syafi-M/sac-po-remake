name: Deploy ke hosting

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, sqlite3
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🏗️ Build Assets
        run: npm run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          timeout: 120000
          log-level: verbose

          local-dir: ./
          server-dir: ./

          exclude: |
            **/.git*
            **/.github/**
            **/.env*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/error_log
            README.md
            phpunit.xml
            package-lock.json
            package.json
            vite.config.js
            tailwind.config.js
            postcss.config.js