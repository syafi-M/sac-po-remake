name: Deploy ke hosting

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Remove local-only files
        run: |
          rm -rf .git .github node_modules tests
          rm -rf storage/logs/* storage/framework/cache/* storage/framework/sessions/* storage/framework/views/*
          rm -f .env .env.* public/error_log

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.env*
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/error_log
            README.md
            phpunit.xml
            package-lock.json
            package.json
            vite.config.js
            tailwind.config.js
            postcss.config.js
